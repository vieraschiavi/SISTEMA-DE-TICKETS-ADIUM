# Los mismos colores que la suite Adium All in One (tickets_ec/marca.py → TEMA;
# un test los cruza).
[theme]
base = "light"
primaryColor = "#EB002C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F7"
textColor = "#3B4A5E"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
port = 8750
# Sólo esta PC: cada integrante abre la suya. Para trabajar todos sobre la
# misma mesa no se comparte la app en la red: se usa el modo compartido, con
# la cuenta de Adium de cada uno y las listas de SharePoint (docs/EQUIPO.md).
address = "127.0.0.1"
